<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website care reports — Bayview Dental</title>
<style>
  :root { --ink:#0f2a3d; --muted:#5b7083; --line:#dde5ec; --brand:#0e7c86; --bg:#f3f7fa; --green:#1a7f4b; --amber:#b54708; --red:#c0262d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:12px 24px; display:flex; align-items:center; gap:10px; }
  .logo { width:32px; height:32px; border-radius:9px; background:var(--brand); color:#fff; display:grid; place-items:center; font-weight:700; flex:none; }
  h1 { margin:0; font-size:17px; } h1 small { color:var(--muted); font-weight:400; font-size:14px; }
  .meta { margin-left:auto; color:var(--muted); font-size:13px; white-space:nowrap; }
  main { max-width:1180px; margin:0 auto; padding:16px 24px 24px; display:grid; grid-template-columns:1fr 300px; gap:16px; align-items:start; }
  h2.cap { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .panel { background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 1px 2px rgba(15,42,61,.04); }
  .report { padding:20px 24px; }
  .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:13px; }
  .pill { color:#fff; font-weight:700; font-size:12px; letter-spacing:.06em; border-radius:999px; padding:3px 12px; }
  .green { background:var(--green); } .amber { background:var(--amber); } .red { background:var(--red); }
  .report h3 { font-size:21px; line-height:1.3; margin:10px 0 14px; }
  .sections { display:grid; grid-template-columns:1fr 1fr; gap:10px 24px; }
  .sections h4 { margin:0 0 2px; font-size:14px; } .sections p { margin:0; color:#33495c; }
  h4.sub { margin:18px 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  ol { margin:0; padding-left:20px; } li { margin-bottom:6px; } li span { color:var(--muted); font-size:12px; }
  table { border-collapse:collapse; width:100%; font-size:13px; } td { padding:5px 8px; border-top:1px solid var(--line); vertical-align:top; }
  td:first-child { color:var(--muted); width:42%; }
  .runs button { all:unset; box-sizing:border-box; cursor:pointer; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; width:100%; padding:10px 14px; border-top:1px solid var(--line); }
  .runs button:first-child { border-top:0; }
  .runs button[aria-current="true"] { background:#e9f4f5; box-shadow:inset 4px 0 var(--brand); }
  .runs button:focus-visible { outline:2px solid var(--brand); outline-offset:-2px; }
  .runs .pill { grid-row:span 2; align-self:center; font-size:10px; padding:2px 8px; min-width:58px; text-align:center; }
  .runs time { font-weight:600; } .runs small { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .note { color:var(--muted); font-size:12px; margin:14px 0 0; }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  @media (max-width: 760px) {
    header { padding:10px 16px; } .meta { display:none; }
    main { grid-template-columns:1fr; padding:12px 16px; }
    .report { padding:16px; } .report h3 { font-size:18px; }
    .sections { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">B</div>
  <h1>Website care reports <small>· Bayview Dental</small></h1>
  <div class="meta">Checked every Monday 08:00 · n8n + Claude</div>
</header>
<main>
  <section><h2 class="cap">Report</h2><div class="panel" id="report"><div class="empty">Loading…</div></div></section>
  <aside><h2 class="cap">Past runs</h2><div class="panel runs" id="runs"></div></aside>
</main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const when = t => new Date(t).toLocaleString('en-GB', { timeZone: 'Asia/Manila', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
let rows = [];
function numbers(d) {
  const h = d.health || {}, l = d.lighthouse, u = d.uptime || {};
  return [
    ['Online', `${u.up} of ${u.checks} checks` + (u.avg_ms != null ? `, average ${u.avg_ms} ms` : '')],
    ['Speed score (mobile)', l ? `${l.score} / 100, main image in ${l.lcp_s} s, page ${l.total_kb} KB` : 'not measured'],
    ['Updates waiting', d.updates_pending + (h.plugins || []).filter(p => p.update).map(p => ` — ${p.slug} ${p.version} → ${p.update}`).join('')],
    ['Last backup', d.backup_age_days == null ? 'none found' : d.backup_age_days === 0 ? 'today' : `${d.backup_age_days} days ago`],
    ['PHP errors (24 h)', h.debug_errors_24h ?? 'unknown'],
    ['WordPress / PHP', `${h.wp_version || '?'} / ${h.php_version || '?'}`],
  ];
}
function show(i) {
  const r = rows[i], p = r.report;
  document.getElementById('report').innerHTML = `<div class="report">
    <div class="top"><span class="pill ${p.status}">${p.status.toUpperCase()}</span>Report #${r.id} · ${esc(when(r.run_at))} · ${r.emailed ? 'emailed to the owner' : 'not emailed'}</div>
    <h3>${esc(p.headline)}</h3>
    <div class="sections">${p.sections.map(s => `<div><h4>${esc(s.title)}</h4><p>${esc(s.body)}</p></div>`).join('')}</div>
    <h4 class="sub">What to do</h4>
    <ol>${p.actions.map(a => `<li><b>${esc(a.what)}</b> <span>(${esc(a.effort)})</span><br>${esc(a.why)}</li>`).join('')}</ol>
    <h4 class="sub">The numbers</h4>
    <table>${numbers(r.data).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>
    <p class="note">Written with AI; every number in the text is checked against the data above${p.guarded ? ` (${p.guarded} sentence${p.guarded > 1 ? 's' : ''} replaced)` : ''}.</p></div>`;
  document.querySelectorAll('.runs button').forEach((b, j) => b.setAttribute('aria-current', j === i));
}
fetch('/p6/state').then(r => r.json()).then(data => {
  rows = data;
  if (!rows.length) { document.getElementById('report').innerHTML = '<div class="empty">No reports yet — POST /webhook/care-run.</div>'; return; }
  document.getElementById('runs').innerHTML = rows.map((r, i) => `<button type="button" data-i="${i}">
    <span class="pill ${r.status}">${r.status.toUpperCase()}</span><time>#${r.id} · ${esc(when(r.run_at))}</time><small>${esc(r.report.headline)}</small></button>`).join('');
  document.getElementById('runs').onclick = e => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); };
  show(0);
});
</script>
</body>
</html>
